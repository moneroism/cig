# chrony.conf - see chrony.conf(5). Network time over NTS: every answer is authenticated, so
# nobody on the way can move the clock (TLS and signature checks depend on it).
# Servers: Netnod (Swedish internet exchange) and PTB (German national metrology institute);
# if neither answers, the ones in /etc/chrony.fallback are added after 60 seconds.
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ptbtime2.ptb.de iburst nts
server ptbtime3.ptb.de iburst nts

# a clock far off at boot (flat battery) is set at once; later it is only slowed or sped up
makestep 1 3
driftfile /var/lib/chrony/drift
ntsdumpdir /var/lib/chrony
# the hardware clock follows (the kernel writes it every 11 minutes)
rtcsync
# no command port on the network: chronyc talks to chronyd through its local socket only.
# No "allow" line: chronyd serves time to nobody
cmdport 0
