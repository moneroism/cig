# unbound.conf - see unbound.conf(5). Everything not set here is unbound's default:
# it listens on 127.0.0.1 and ::1 only and resolves from the root servers itself.
server:
    # DNSSEC: the root trust anchor, kept current by unbound-anchor (RFC 5011)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    # runit supervises it: no chroot, no pid file, log to the service log
    chroot: ""
    directory: "/var/lib/unbound"
    pidfile: ""
    use-syslog: no
    # tell nobody which software answers
    hide-identity: yes
    hide-version: yes
